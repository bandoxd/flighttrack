<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Indonesia Flight Deal Monitor</title>
<style>
.viz-root{color-scheme:light;--bg:#f4f4f2;--surface-1:#fcfcfb;--surface-2:#f6f6f4;--border:#e3e2de;--grid:#ebeae6;
--text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#77766f;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;
--good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;--accent:#2a78d6}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .viz-root{color-scheme:dark;--bg:#111110;
--surface-1:#1a1a19;--surface-2:#20201f;--border:#2e2e2c;--grid:#262624;--text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#94938a;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--accent:#3987e5}}
:root[data-theme="dark"] .viz-root{color-scheme:dark;--bg:#111110;--surface-1:#1a1a19;--surface-2:#20201f;--border:#2e2e2c;--grid:#262624;
--text-primary:#f0efec;--text-secondary:#c3c2b7;--text-muted:#94938a;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--accent:#3987e5}
*{box-sizing:border-box}
body{margin:0}
.viz-root{background:var(--bg);color:var(--text-primary);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:20px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-size:21px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0;font-weight:650}
.sub{color:var(--text-secondary);font-size:13px}
.muted{color:var(--text-muted)}
.err{color:var(--critical)}
a{color:var(--accent)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 8px;flex-wrap:wrap}
.banner{border-radius:10px;padding:10px 14px;font-weight:600;border:1px solid var(--serious);background:color-mix(in srgb,var(--serious) 14%,transparent)}
.status{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;font-size:13px}
.status b{font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--border);white-space:nowrap;background:var(--surface-1)}
.badge i{width:8px;height:8px;border-radius:50%;display:inline-block}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;background:var(--surface-1);color:var(--text-primary);border:1px solid var(--border);border-radius:999px;padding:4px 12px;cursor:pointer;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--text-primary);font-weight:600}
button.plain{font:inherit;font-size:12px;background:transparent;color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer}
button.plain[aria-pressed="true"]{background:var(--grid)}
/* Verbindungs-Pakete */
.conns{display:grid;gap:8px}
details.conn{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
details.conn[open]{border-color:var(--text-muted)}
details.conn > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:110px 1fr auto;gap:6px 16px;align-items:center;padding:12px 14px}
details.conn > summary::-webkit-details-marker{display:none}
details.conn > summary:hover{background:var(--surface-2)}
.price{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.price small{display:block;font-size:11px;font-weight:500;color:var(--text-muted)}
.route{display:flex;flex-direction:column;gap:3px;min-width:0}
.legline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px}
.legline .ap{font-weight:650;letter-spacing:.02em}
.pill{font-size:12px;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--grid);border-radius:6px;padding:0 6px;white-space:nowrap}
.meta{font-size:12px;color:var(--text-muted)}
.chev{color:var(--text-muted);font-size:18px;transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.body{border-top:1px solid var(--grid);padding:14px;display:grid;gap:14px;background:var(--surface-2)}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.legbox h3{font-size:13px;margin:0 0 8px;color:var(--text-secondary);font-weight:650}
.seg{display:grid;grid-template-columns:58px 1fr auto;gap:2px 10px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-1)}
.seg .t{font-variant-numeric:tabular-nums;font-weight:650}
.seg .fn{grid-column:1/-1;font-size:12px;color:var(--text-muted)}
.lay{margin:4px 0 4px 18px;padding:2px 0 2px 12px;border-left:2px dashed var(--border);font-size:12px;color:var(--text-secondary)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;font-size:13px}
.facts .k{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:13px;border-radius:8px;padding:6px 12px}
.warn{font-size:12px;color:var(--text-secondary)}
.empty{color:var(--text-muted);padding:16px 0;text-align:center}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi .lbl{color:var(--text-secondary);font-size:12px;display:flex}
.kpi .val{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin:2px 0}
/* Chart + Tabellen */
.chart-wrap{position:relative}
svg text{fill:var(--text-secondary);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;min-width:170px;z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-secondary);margin:6px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--text-secondary);font-weight:600;font-size:12px}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
.ground{font-size:12px;color:var(--text-secondary);display:grid;gap:2px}
.ground b{color:var(--text-primary)}
.cell{border-radius:6px;padding:2px 6px;display:inline-block;min-width:58px;text-align:right}
details.more{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
details.more > summary{cursor:pointer;font-weight:650}
details.more[open] > summary{margin-bottom:10px}
@media (max-width:640px){details.conn > summary{grid-template-columns:1fr auto}.price{grid-column:1/-1;display:flex;gap:10px;align-items:baseline}.price small{display:inline}}
</style>
</head>

  // Filter
  h += `<div class="chips" role="group" aria-label="Reise filtern"><button class="chip" data-t="all" aria-pressed="${TRIP === 'all'}">Alle Reisen</button>` +
    TRIPS.map(t => `<button class="chip" data-t="${t.id}" aria-pressed="${TRIP === t.id}"><span class="swatch" style="background:${tcolor(t.id)}"></span>${esc(t.emoji)} ${esc(t.name)}</button>`).join('') + `</div>`;
  if (TRIP !== 'all') h += `<div class="chips" role="group" aria-label="Route filtern" style="margin-top:-4px"><button class="chip" data-v="all" aria-pressed="${VAR === 'all'}">Alle Routen</button>` +
    T(TRIP).variants.map(v => `<button class="chip" data-v="${v.id}" aria-pressed="${VAR === v.id}">${esc(v.name)}${v.weight === 0 ? ' <span class="muted">(pausiert)</span>' : ''}</button>`).join('') + `</div>`;
  // Deals
  const laterHigher = d => D.obs.some(o => o.variant === d.variant && o.out === d.out && o.ret === d.ret && o.ts > d.ts && o.best_total && o.best_total > d.eval.total + (th.renotify_drop_eur || 25) && !(d.recheck && d.recheck.ts > o.ts && d.recheck.status === 'verfügbar'));
  const deals = D.deals.filter(d => d.eval.notify && !d.expired && !laterHigher(d) && Date.parse(d.ts) >= REF - 21*864e5).filter(inF).sort((a,b) => (a.eval.score ?? a.eval.effective) - (b.eval.score ?? b.eval.effective));
  h += `<div class="sechead"><h2>🔔 Deals</h2><span class="meta">Angebote, die deine Kriterien erfüllen (letzte 21 Tage) · nicht mehr verfügbare werden automatisch aussortiert</span></div>`;
  h += deals.length ? `<div class="conns">${deals.slice(0, 8).map(d => connCard(fromDeal(d))).join('')}</div>` : `<div class="card empty">Noch kein Angebot unter deinen Schwellen – sobald eins auftaucht, erscheint es hier und du bekommst eine Nachricht.</div>`;
  // Verbindungen
  const conns = Object.values(latestAll).filter(inF).sort((a,b) => (a.score ?? a.effective ?? a.best_total) - (b.score ?? b.effective ?? b.best_total));
  h += `<div class="sechead"><h2>✈️ Günstigste Verbindungen</h2><span class="meta">${conns.length} Termine (letzte 14 Tage) · sortiert nach Gesamtkosten inkl. Inland, Reisezeit & Umstiegen · antippen für Details</span></div>`;
  h += conns.length ? `<div class="conns">${conns.slice(0, SHOW).map(o => connCard(fromObs(o))).join('')}</div>` +
       (conns.length > SHOW ? `<div style="text-align:center"><button class="plain" id="moreconn">${Math.min(8, conns.length - SHOW)} weitere anzeigen</button></div>` : '')
     : `<div class="card empty">Noch keine Messwerte.</div>`;
  // Verlauf
  h += `<div class="sechead"><h2>📈 Preisentwicklung</h2></div>`;
  h += `<section class="card"><div class="sechead" style="margin:0"><span class="meta">Günstigster Flugpreis pro Tag und Reise · gestrichelt: ${th.extreme} / ${th.good} / ${th.normal} €</span>
    <span><button class="plain" id="vchart" aria-pressed="true">Diagramm</button> <button class="plain" id="vtable" aria-pressed="false">Tabelle</button></span></div>
    <div class="legend">${TRIPS.map(t => `<span><span class="swatch" style="background:${tcolor(t.id)}"></span>${esc(t.emoji)} ${esc(t.name)}</span>`).join('')}</div>
    <div id="chart" class="chart-wrap"></div><div id="ctable" class="scroll" hidden></div></section>`;
  // Matrix
  const cols = TRIP === 'all' ? TRIPS.map(t => ({id:t.id, label:t.emoji + ' ' + t.id, match:o => o.trip === t.id, color:tcolor(t.id)}))
                              : T(TRIP).variants.map(v => ({id:v.id, label:v.id, match:o => o.variant === v.id, color:tcolor(TRIP)}));
  const lm = {};
  D.obs.forEach(o => cols.forEach(c => { if (!c.match(o)) return; const k = c.id + '|' + o.out; const cur = lm[k];
    if (!cur || (o.best_total && (!cur.best_total || (TRIP === 'all' ? o.best_total < cur.best_total : cur.ts < o.ts)))) lm[k] = o; }));
  const outs = [...new Set(Object.keys(lm).map(k => k.split('|')[1]))].sort();
  h += `<details class="more"><summary>📅 Preis nach Abflugtag (${outs.length} Termine${TRIP === 'all' ? ', bester Wert je Reise' : ''})</summary><div class="scroll">` + (outs.length ? `<table><thead><tr><th>Abflug</th>${cols.map(c => `<th class="num"><span class="swatch" style="background:${c.color}"></span>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>` +
    outs.map(d => `<tr><td>${fdd(d)} ${d.slice(2,4)}</td>` + cols.map(c => { const o = lm[c.id + '|' + d];
      if (!o) return '<td class="num muted">·</td>';
      if (!o.best_total) return `<td class="num" title="${esc(o.error || o.status)}">${o.status === 'error' ? '<span class="err">Fehler</span>' : '<span class="muted">keine</span>'}</td>`;
      const t = TIER[o.tier] || {};
      return `<td class="num"><span class="cell" style="background:color-mix(in srgb,${t.c} 16%,transparent)" title="${esc(o.tier)} · ${esc(V(o.variant).name)} · Rückflug ${fd(o.ret)} · ${esc((o.airlines||[]).join(', '))} · gemessen ${fdt(o.ts)}">${eur(o.best_total)}</span></td>`; }).join('') + '</tr>').join('') +
    `</tbody></table>` : '<div class="empty">Noch keine Messwerte.</div>') + `</div></details>`;
  // Läufe
  const errRuns = runsSorted.filter(r => r.errors && r.errors.length).length;
  h += `<details class="more"><summary>🛠 Letzte Suchläufe & Fehler ${errRuns ? `<span class="badge" style="margin-left:6px"><i style="background:var(--critical)"></i>${errRuns} mit Fehlern</span>` : ''}</summary><div class="scroll">` + (runsSorted.length ? `<table><thead><tr><th>Zeit</th><th>Status</th><th class="num">Suchen</th><th>Ergebnisse</th><th>Fehler / Hinweise</th></tr></thead><tbody>` +
    runsSorted.slice(0, 30).map(r => `<tr><td>${fdt(r.ts)}</td><td>${sbadge(r.status)}</td><td class="num">${r.searches}${r.verifications ? ' + ' + r.verifications : ''}</td>
      <td style="font-size:12px">${(r.results||[]).map(x => `${esc(T(V(x.variant).trip).emoji)} ${esc(x.variant)} ${fd(x.out)}: ${x.total ? eur(x.total) : '<span class="' + (x.status === 'error' ? 'err' : 'muted') + '">' + esc(x.message || x.status) + '</span>'}`).join('<br>') || '—'}</td>
      <td style="font-size:12px">${(r.errors||[]).map(e => '<span class="err">' + esc(e) + '</span>').join('<br>')}${(r.notes||[]).length ? '<div class="muted">' + r.notes.map(esc).join('<br>') + '</div>' : ''}</td></tr>`).join('') +
    `</tbody></table>` : '<div class="empty">Noch kein Suchlauf.</div>') + `</div></details>`;
  h += `<footer class="sub">Daten: Google Flights über SerpApi · Seite erzeugt ${fdt(D.generated)} · Flugpreise sind Momentaufnahmen. Inland/Fähren = recherchierte Richtwerte (Stand Nov 2026), keine Live-Preise. „wahrscheinlich inklusive“ = Annahme nach Airline-Standard, „verifiziert“ = laut Buchungsoption. Es wird nie automatisch gebucht.</footer>`;
  app.innerHTML = h;
  drawChart();
  app.querySelectorAll('.chip[data-t]').forEach(b => b.onclick = () => { TRIP = b.dataset.t; VAR = 'all'; SHOW = 8; render(); });
  app.querySelectorAll('.chip[data-v]').forEach(b => b.onclick = () => { VAR = b.dataset.v; SHOW = 8; render(); });
  const mc = document.getElementById('moreconn'); if (mc) mc.onclick = () => { SHOW += 8; render(); };
  document.getElementById('theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('fdm-theme', r.dataset.theme); } catch(e){} drawChart(); };
  const vc = document.getElementById('vchart'), vt = document.getElementById('vtable'), chart = document.getElementById('chart'), ctable = document.getElementById('ctable');
  vc.onclick = () => { vc.setAttribute('aria-pressed','true'); vt.setAttribute('aria-pressed','false'); chart.hidden = false; ctable.hidden = true; };
  vt.onclick = () => { vt.setAttribute('aria-pressed','true'); vc.setAttribute('aria-pressed','false'); chart.hidden = true; ctable.hidden = false; };
}

function series(){
  const by = {};
  D.obs.filter(o => o.best_total && inF(o)).forEach(o => {
    const day = new Date(o.ts).toLocaleDateString('sv-SE',{timeZone:TZ});
    const k = o.trip + '|' + day;
    if (!by[k] || o.best_total < by[k].v) by[k] = {v:o.best_total, o};
  });
  const ds = [...new Set(Object.keys(by).map(k => k.split('|')[1]))].sort();
  return {days: ds, s: TRIPS.map(t => ({id:t.id, label:t.emoji + ' ' + t.id, pts: ds.map((d,i) => by[t.id+'|'+d] ? {i, d, ...by[t.id+'|'+d]} : null).filter(Boolean)}))};
}

function drawChart(){
  const el = document.getElementById('chart'), tb = document.getElementById('ctable');
  const {days, s} = series();
  if (!days.length){ el.innerHTML = '<div class="empty">Der Verlauf erscheint nach den ersten erfolgreichen Suchläufen.</div>'; tb.innerHTML = el.innerHTML; return; }
  const th = D.config.thresholds;
  const W = Math.max(320, el.clientWidth || 900), H = 260, m = {l:52, r:96, t:12, b:28};
  const vals = s.flatMap(x => x.pts.map(p => p.v)).concat([th.extreme, th.normal]);
  let lo = Math.floor((Math.min(...vals) - 30)/50)*50, hi = Math.ceil((Math.max(...vals) + 30)/50)*50;
  const X = i => m.l + (days.length === 1 ? (W-m.l-m.r)/2 : i * (W-m.l-m.r)/(days.length-1));
  const Y = v => m.t + (hi - v) * (H-m.t-m.b) / (hi - lo);
  let g = `<svg width="${W}" height="${H}" role="img" aria-label="Preisverlauf je Variante">`;
  const step = (hi-lo) > 600 ? 200 : (hi-lo) > 300 ? 100 : 50;
  for (let v = Math.ceil(lo/step)*step; v <= hi; v += step) g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${v.toLocaleString('de-DE')} €</text>`;
  [[th.extreme,'extrem'],[th.good,'gut'],[th.normal,'normal']].forEach(([v,l]) => { if (v > lo && v < hi) g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--text-muted)" stroke-dasharray="4 4" stroke-width="1"/><text x="${m.l+4}" y="${Y(v)-4}" style="fill:var(--text-muted)">${l} ${v} €</text>`; });
  const every = Math.ceil(days.length / Math.max(2, Math.floor((W-m.l-m.r)/70)));
  days.forEach((d,i) => { if (i % every === 0 || i === days.length-1) g += `<text x="${X(i)}" y="${H-8}" text-anchor="middle">${d.slice(8,10)}.${d.slice(5,7)}.</text>`; });
  const ends = [];
  s.forEach(x => { if (!x.pts.length) return; const c = tcolor(x.id);
    g += `<path d="${x.pts.map((p,k) => (k?'L':'M') + X(p.i).toFixed(1) + ',' + Y(p.v).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    x.pts.forEach(p => g += `<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="4" fill="${c}" stroke="var(--surface-1)" stroke-width="2"/>`);
    const lp = x.pts.at(-1); if (lp.i === days.length - 1) ends.push({id:x.label, v:lp.v, y:Y(lp.v)+4}); });
  ends.sort((a,b) => a.y - b.y).forEach((e,k,arr) => { if (k && e.y - arr[k-1].y < 13) e.y = arr[k-1].y + 13; g += `<text x="${W-m.r+8}" y="${e.y}" style="fill:var(--text-primary);font-weight:600">${e.id} ${eur(e.v)}</text>`; });
  g += `<line id="xh" y1="${m.t}" y2="${H-m.b}" stroke="var(--text-muted)" stroke-width="1" visibility="hidden"/><rect x="${m.l-10}" y="0" width="${W-m.l-m.r+20}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div>`;
  el.innerHTML = g;
  const hit = el.querySelector('#hit'), tip = el.querySelector('#tip'), xh = el.querySelector('#xh');
  hit.addEventListener('mousemove', ev => { const r = el.getBoundingClientRect(); const px = ev.clientX - r.left;
    let i = Math.round((px - m.l) / ((W-m.l-m.r)/Math.max(1, days.length-1))); i = Math.max(0, Math.min(days.length-1, i));
    xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('visibility','visible');
    const rows = s.map(x => ({x, p: x.pts.find(p => p.i === i)})).filter(r => r.p).sort((a,b) => a.p.v - b.p.v);
    tip.innerHTML = `<b>${fd(days[i])}</b>` + (rows.length ? rows.map(r => `<div><span class="swatch" style="background:${tcolor(r.x.id)}"></span>${esc(r.x.label)}: <b>${eur(r.p.v)}</b> <span class="muted">${fd(r.p.o.out)}→${fd(r.p.o.ret)}</span></div>`).join('') : '<div class="muted">keine Daten</div>');
    tip.style.display = 'block'; tip.style.left = Math.min(px + 14, W - 230) + 'px'; tip.style.top = '16px'; });
  hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; xh.setAttribute('visibility','hidden'); });
  tb.innerHTML = `<table><thead><tr><th>Tag</th>${s.map(x => `<th class="num">${esc(x.label)}</th>`).join('')}</tr></thead><tbody>${days.map((d,i) => `<tr><td>${fd(d)}</td>${s.map(x => { const p = x.pts.find(p => p.i === i); return `<td class="num">${p ? eur(p.v) : '—'}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
}
try { const t = localStorage.getItem('fdm-theme'); if (t) document.documentElement.dataset.theme = t; } catch(e){}
render();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawChart, 150); });
</script>
</body>
</html>
